<!doctype html>
<!-- Vite's entry point, and the ONE page the browser ever loads.

     Notice how little is in it. There is no content here at all - just an
     empty div and one script. React fills that div in. Every screen you write
     goes inside it.

     This is what people mean by a single-page app: one real HTML file, and
     JavaScript swapping what is inside it. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Build Step — i.c.stars</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
