            <h1 class="ics-title">The Build Step</h1>
            <p class="ics-sub">

              By the end you will have written React, seen what the computer turns it into,
              and drawn a graph from real API numbers.
            </p>

        <main class="ics-wrap">

          <!-- ================= THE EDITOR ================= -->
          <span class="ics-step">The editor</span>

          <p class="ics-sub bs-note">
            Pick a stage. <strong>You write the left. The computer turns it into the middle.
            The middle is what draws the right.</strong> Change the left and watch both follow.
          </p>

          <div class="bs-stages">
            <button class="bs-stagebtn" data-stage="hello" aria-pressed="true">1 &middot; Hello World</button>
            <button class="bs-stagebtn" data-stage="profile" aria-pressed="false">2 &middot; Profile</button>
            <button class="bs-stagebtn" data-stage="data" aria-pressed="false">3 &middot; Data</button>
          </div>

          <div class="bs-three">
            <div class="bs-pane">
              <label class="bs-label" for="jsx">1 &middot; You write this</label>
              <textarea id="jsx" class="ics-input" spellcheck="false" rows="20"></textarea>
            </div>
            <div class="bs-pane">
              <label class="bs-label" for="out">2 &middot; The computer makes this</label>
              <pre id="out" class="bs-out" aria-live="polite"></pre>
            </div>
            <div class="bs-pane">
              <label class="bs-label">3 &middot; And you see this</label>
              <div id="stage" class="bs-stage"></div>
              <p id="stageMsg" class="bs-stagemsg" aria-live="polite"></p>
            </div>
          </div>

          <div class="ics-row bs-row">
            <label class="bs-check">
              <input type="checkbox" id="modern">
              <span>Show the modern version (what Vite really does)</span>
            </label>
          </div>

          <!-- ================= ACT 1 ================= -->
          <span class="ics-step">Stage 1 &middot; Hello World</span>

          <p class="ics-sub bs-note">
            Click <strong>1 &middot; Hello World</strong> above. Two lines. Look at all three columns.
          </p>

          <ol class="bs-beats">
            <li><strong>You wrote a tag.</strong> <code>&lt;h1&gt;Hello, world&lt;/h1&gt;</code> looks like
              HTML, but it is sitting inside JavaScript. Mixing the two like this is called
              <strong>JSX</strong>.</li>

            <li><strong>No browser understands JSX.</strong> Not one, not ever. So something has to
              rewrite it first.</li>

            <li><strong>Look at the middle column.</strong> Your tag became
              <code>React.createElement("h1", null, "Hello, world")</code> &mdash; an ordinary function
              call. That is all a tag ever was.</li>

            <li><strong>That rewrite is the build step.</strong> It is the whole reason a React project
              needs installing. <strong>Vite</strong> is the tool that does it for you, every time you
              save.</li>
          </ol>

          <p class="ics-sub bs-note">
            Try it: delete the <code>&lt;/h1&gt;</code>. The middle column turns into an error message
            with a line number, and nothing draws. That is the build step telling you it cannot finish.
          </p>

          <!-- ================= ACT 2 ================= -->
          <span class="ics-step">Stage 2 &middot; Profile</span>

          <p class="ics-sub bs-note">
            Click <strong>2 &middot; Profile</strong>. Same idea, bigger: a profile card.
          </p>

          <ol class="bs-beats">
            <li><strong>A component is a box you named.</strong> That is all. You drew a box round
              part of the page, gave it a name, and now you can use it again.</li>

            <li><strong>Boxes go inside boxes.</strong> The card holds an <code>Avatar</code> and three
              <code>Stat</code>s. <code>Stat</code> exists because the card needed three of them &mdash;
              that is the only good reason to make one.</li>

            <li><strong>Props are what you put in the box.</strong>
              <code>&lt;Stat label="commits" value={48} /&gt;</code> &mdash; same box, different contents.
              The box decides how it looks; whoever uses it decides what goes in.</li>

            <li><strong>A capital letter means your box.</strong> <code>&lt;Avatar /&gt;</code> is yours.
              <code>&lt;div /&gt;</code> is an HTML tag. That is the entire rule.</li>
          </ol>

          <p class="ics-sub bs-note">
            Here is the finished card. <strong>Hover a row to find that box on the card.</strong>
          </p>

          <div class="bs-break">
            <div><ul class="bs-tree" id="tree"></ul></div>
            <div class="bs-demowrap"><div id="demo" class="bs-stage bs-stage-tall"></div></div>
          </div>

          <!-- ================= ACT 3 ================= -->
          <span class="ics-step">Stage 3 &middot; Data</span>

          <p class="ics-sub bs-note">
            The profile card had its numbers typed into it. Real numbers do not work like that &mdash;
            they live somewhere else, and you have to go and ask.
          </p>

          <ol class="bs-beats">
            <li><strong>An API is a window you ask questions through.</strong> You pass a question in.
              It passes an answer back. You never go inside.</li>

            <li><strong>Our API is one window</strong> at
              <code>c21-data-gateway</code>. You send it a question written in SQL and it sends back
              the rows. That is the whole arrangement.</li>

            <li><strong>The answer comes back as JSON</strong> &mdash; a way of writing down data so a
              program can read it. Two parts matter: <code>columns</code> (what each slot means) and
              <code>rows</code> (the slots).</li>

            <li><strong>A graph is just those rows, drawn.</strong> No new data appears when you make a
              chart. Every bar is one row.</li>
          </ol>

          <p class="ics-sub bs-note">You send this:</p>

      <pre class="bs-code-block">POST https://c21-data-gateway.icstars-milwaukee.workers.dev/api/query

      {
        "team": "your-team",
        "sql":  "SELECT \"assignment group\" AS team, COUNT(*) AS open_tickets
                 FROM servicenow.incident
                 WHERE state NOT IN ('Resolved', 'Closed')
                 GROUP BY \"assignment group\"
                 ORDER BY open_tickets DESC
                 LIMIT 6"
      }</pre>

          <p class="ics-sub bs-note">
            And you get this back. <strong>Hover a row on the left to find its bar on the right</strong>
            &mdash; they are the same six numbers, written down twice.
          </p>

          <div class="bs-data">
            <div>
              <label class="bs-label">The answer &mdash; JSON</label>

              <ul class="g-chips" id="rowlist"></ul>
            </div>
            <div>
              <label class="bs-label">The same rows, drawn</label>
              <div class="g-card" id="graph"></div>
              <p class="ics-sub bs-note" style="margin-top:10px">
                One colour for every bar, because the <em>length</em> already tells you which is
                biggest. Colour is saved for a different job.
              </p>
            </div>
          </div>

          <p class="ics-sub bs-note">
            Now click <strong>3 &middot; Data</strong> in the editor. That is this graph, built in
            React, in about fifteen lines. The reply is handed to it as <code>api</code>.
          </p>

          <!-- ================= WHERE FILES GO ================= -->
          <span class="ics-step">Where the files go</span>

          <p class="ics-sub bs-note">
            A real Vite React project, with those boxes in it. Each folder answers one question.
          </p>

      <pre class="bs-code-block">my-app/
      ├── index.html              the ONE page the browser loads
      ├── package.json            the shopping list: what to install, what to run
      │
      ├── src/                    everything YOU write lives here
      │   ├── main.jsx            the plug: puts &lt;App /&gt; on the page
      │   ├── App.jsx             the top of your app
      │   │
      │   ├── components/         your boxes. One box, one file, named the same.
      │   │   ├── Avatar.jsx
      │   │   ├── Stat.jsx
      │   │   └── Bar.jsx
      │   │
      │   └── lib/                code that is NOT a box: asking the API, maths
      │       └── api.js
      │
      └── node_modules/           the downloaded code. Never opened, never committed.</pre>

          <ul class="bs-rules">
            <li><strong>One box, one file, same name.</strong> <code>Avatar.jsx</code> holds
              <code>Avatar</code>. When something looks wrong you know which file to open.</li>
            <li><strong><code>components/</code> draws. <code>lib/</code> fetches.</strong> Asking the
              API goes in <code>lib/</code>. That split is what lets you fix a question without
              touching a single box.</li>
            <li class="bs-rules-no"><strong>Folder names are not law.</strong> Any layout where
              "where do I change this?" has one obvious answer is a good one. Pick it and keep it.</li>
          </ul>

          <!-- ================= INSTALL ================= -->
          <span class="ics-step">Install one yourself</span>

          <p class="ics-sub bs-note">
            Six commands. Tick them as you go &mdash; this page remembers. Each one has a
            <strong>done when</strong>, so you never have to guess whether it worked.
          </p>

          <ol class="bs-steps" id="steps"></ol>

          <p class="ics-footer">
            The translating is done by
            <a href="https://babeljs.io/docs/babel-standalone">@babel/standalone</a> from a CDN &mdash;

            <br>Open this one in the <a href="playground.html">live editor</a>.
          </p>

    <script type="text/plain" data-pg-file="css/build.css">
      /* Local to this workshop. Everything else comes from ../../css/theme.css,
         which is shared and never forked. */

      .bs-note { color: var(--grey-dark); margin-top: 10px; max-width: 80ch; }

      /* ---- the three stage buttons ---- */
      .bs-stages { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
      .bs-stagebtn {
        font: inherit; font-size: 14.5px; font-weight: 700;

        background: none; color: var(--grey-dark);

      .bs-stagebtn:hover { color: var(--ink); border-color: var(--grey-dark); }
      .bs-stagebtn[aria-pressed="true"] {
        background: var(--red); border-color: var(--red); color: #fff;
      }
      .bs-stagebtn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

      /* ---- the three columns: write it, see it translated, see it drawn ---- */
      .bs-three {
        display: grid; gap: 14px; margin-top: 14px;
        grid-template-columns: 1.05fr 1fr .9fr;
      }
      @media (max-width: 1100px) { .bs-three { grid-template-columns: 1fr 1fr; } }

      .bs-pane { display: flex; flex-direction: column; min-width: 0; }

        border-radius: 6px; white-space: pre-wrap; word-break: break-word;

      .bs-stagemsg.bs-bad  { color: var(--red); }

      .bs-row { margin-top: 12px; align-items: center; }
      .bs-check { display: inline-flex; align-items: center; gap: .55em; font-size: 14px; color: var(--grey-dark); cursor: pointer; }
      .bs-check input { width: 1.1em; height: 1.1em; cursor: pointer; }

      .bs-beats { margin: 12px 0 0; padding-left: 1.4em; max-width: 82ch; }
      .bs-beats li { margin-bottom: .75em; font-size: 15px; color: var(--grey-dark); line-height: 1.6; }

      /* ---- THE PROFILE CARD ---- */
      .pf-card {
        width: 100%; max-width: 19rem; background: var(--paper);
        border: 1px solid #E3DCD6; border-radius: 10px; padding: 16px;

        flex: none; width: 46px; height: 46px; border-radius: 50%;

      }

      .pf-role { margin: 2px 0 0; font-size: 13px; color: var(--grey-dark); }

      .bs-break { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-top: 14px; align-items: start; }

      .bs-tree { list-style: none; margin: 0; padding: 0; }
      .bs-part {

      .bs-file { font-family: var(--mono); font-size: .76rem; color: var(--red); }
      .bs-job { font-size: 13.5px; color: var(--grey-dark); }
      .bs-part-on { border-left-color: var(--red); background: #FFF7F9; }

      /* ---- stage 3: the reply beside the graph ---- */
      .bs-data { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; align-items: start; }

        padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; width: 100%;
      }
      .g-row { display: grid; grid-template-columns: 7.5rem 1fr 2.2rem; gap: 10px; align-items: center; }
      .g-name { font-size: 13px; color: var(--grey-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .g-track { background: #F1EAE4; border-radius: 4px; height: 16px; overflow: hidden; }

      .g-chips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }

      .g-chip.g-lit { border-left-color: var(--red); }
      .g-row.g-lit .g-track { background: #F7DCE4; }
      .g-row.g-lit .g-name, .g-row.g-lit .g-value { color: var(--ink); font-weight: 600; }

      /* ---- the folder rules ---- */
      .bs-rules { margin: 12px 0 0; padding-left: 1.3em; max-width: 82ch; }

      .bs-rules li strong { color: var(--ink); }
      .bs-rules-no { opacity: .85; }

      /* ---- the install checklist ---- */

      .bs-step { border: 1px solid #E3DCD6; border-radius: 8px; margin-bottom: 10px; }
      .bs-step label { display: flex; gap: .9em; padding: .9em 1em; cursor: pointer; align-items: flex-start; }
      .bs-step input { flex: none; width: 1.25em; height: 1.25em; margin-top: .2em; cursor: pointer; }
      .bs-step label > span { display: flex; flex-direction: column; gap: .35em; min-width: 0; }
      .bs-cmd { font-family: var(--mono); font-size: .88rem; word-break: break-all; }
      .bs-why { font-size: 14px; color: var(--grey-dark); }
      .bs-done { font-size: 13px; color: var(--grey-dark); }
      .bs-done b { color: var(--ink); }
      .bs-step input:checked ~ span .bs-cmd { opacity: .5; text-decoration: line-through; }
    </script>
    <script type="text/plain" data-pg-file="js/main.js">
      /* ============================================================
         THE BUILD STEP   —   Hello World  ->  Profile  ->  Data

         One editor, three stages. Each stage is the one before it, plus one new
         idea. Nothing in this file is clever.

         React, ReactDOM and Babel are plain globals from CDN <script> tags. Babel is
         the translator. Vite runs the same translator for you on every save - that is
         the whole thing this workshop is about.
         ============================================================ */

      /* ---- the data the stages are handed ---------------------------------------

         PERSON is for the profile card.

         API is a real reply from the Cycle 21 data API, with the team names and
         numbers swapped for made-up ones. The SHAPE is exactly what you get back:
         a list of column names, and a list of rows. Nothing else.                  */

      const PERSON = {
        initials: "JR",
        name: "Jordan Rivera",
        role: "Tech Apprentice",
        stats: [
          { label: "commits", value: 48 },
          { label: "PRs", value: 7 },
          { label: "weeks", value: 8 },
        ],
      };

      const API = {
        ok: true,
        columns: ["team", "open_tickets"],
        rows: [
          ["Service Desk", 57],
          ["Network", 44],
          ["Cloud Platform", 41],
          ["Field Support", 23],
          ["Apps", 18],
          ["Security", 9],
        ],
        rowCount: 6,
        durationMs: 2651,
      };

      /* ---- the three stages ----------------------------------------------------- */

      const STAGES = {
        hello: `function App() {
        return <h1>Hello, world</h1>;
      }`,

        profile: `function Avatar({ initials }) {
        return <div className="pf-avatar">{initials}</div>;
      }

      function Stat({ label, value }) {
        return (
          <div className="pf-stat">
            <b>{value}</b>
            <span>{label}</span>
          </div>
        );
      }

      function App() {
        return (
          <article className="pf-card">
            <header className="pf-head">
              <Avatar initials={person.initials} />
              <div>
                <h3 className="pf-name">{person.name}</h3>
                <p className="pf-role">{person.role}</p>
              </div>
            </header>

            <div className="pf-stats">
              {person.stats.map((s) => (
                <Stat key={s.label} label={s.label} value={s.value} />
              ))}
            </div>
          </article>
        );
      }`,

        data: `function Bar({ name, value, most }) {
        return (
          <div className="g-row">
            <span className="g-name">{name}</span>
            <span className="g-track">
              <span className="g-bar" style={{ width: (value / most) * 100 + "%" }} />
            </span>
            <b className="g-value">{value}</b>
          </div>
        );
      }

      function App() {
        const most = Math.max(...api.rows.map((r) => r[1]));

        return (
          <div className="g-card">
            <h3 className="pf-name">Open tickets by team</h3>

            {api.rows.map((row) => (
              <Bar key={row[0]} name={row[0]} value={row[1]} most={most} />
            ))}

            <p className="g-foot">{api.rowCount} teams · from the API</p>
          </div>
        );
      }`,
      };

      /* ---- the editor ----------------------------------------------------------- */

      const jsxBox   = document.getElementById("jsx");
      const outBox   = document.getElementById("out");
      const stage    = document.getElementById("stage");
      const stageMsg = document.getElementById("stageMsg");
      const modern   = document.getElementById("modern");

      let root = null;

      // Step one: JSX text in, JavaScript text out. This is Babel. This is Vite's job.
      function compile(source, runtime) {
        return Babel.transform(source, {
          presets: [["react", { runtime: runtime || "classic" }]],
          compact: false,
        }).code;
      }

      // Step two: run that JavaScript. This is the browser, and always was.
      function run(code) {
        const make = new Function("React", "person", "api",
          code + "\n return typeof App !== 'undefined' ? App : null;");
        const App = make(React, PERSON, API);
        if (!App) throw new Error("No component called App - did you rename it?");
        if (!root) root = ReactDOM.createRoot(stage);
        root.render(React.createElement(App));
      }

      function update() {
        const runtime = modern.checked ? "automatic" : "classic";

        let code;
        try {
          code = compile(jsxBox.value, runtime);
          outBox.textContent = code;
          outBox.classList.remove("bs-error");
        } catch (err) {
          // A JSX mistake stops here. The message is the useful part - it has the
          // line and the column in it.
          outBox.textContent = String(err.message);
          outBox.classList.add("bs-error");
          stageMsg.textContent = "Nothing drawn - the JSX did not translate. Read the message in the middle.";
          stageMsg.className = "bs-stagemsg bs-bad";
          return;
        }

        try {
          // The modern runtime writes an `import`, and a browser cannot run an import
          // on its own - that is what a bundler is for. So the picture uses the
          // classic output while you read either one.
          run(runtime === "automatic" ? compile(jsxBox.value, "classic") : code);
          stageMsg.textContent = "Drawn. That picture is the middle column, running.";
          stageMsg.className = "bs-stagemsg bs-good";
        } catch (err) {
          stageMsg.textContent = "Translated, but would not run: " + err.message;
          stageMsg.className = "bs-stagemsg bs-bad";
        }
      }

      function load(which) {
        jsxBox.value = STAGES[which];
        update();
        document.querySelectorAll("[data-stage]").forEach((b) => {
          b.setAttribute("aria-pressed", String(b.dataset.stage === which));
        });
      }

      document.querySelectorAll("[data-stage]").forEach((b) => {
        b.addEventListener("click", () => load(b.dataset.stage));
      });
      jsxBox.addEventListener("input", update);
      modern.addEventListener("change", update);

      load("hello");

      /* ---- Act 2: the card, and the boxes it is made of -------------------------

         A second copy, built by hand, so breaking the editor above cannot break it.
         Hover a row and the matching box lights up.                               */

      function FixedCard() {
        const h = React.createElement;
        return h("article", { className: "pf-card" },
          h("header", { className: "pf-head" },
            h("div", { className: "pf-avatar" }, PERSON.initials),
            h("div", null,
              h("h3", { className: "pf-name" }, PERSON.name),
              h("p", { className: "pf-role" }, PERSON.role))),
          h("div", { className: "pf-stats" },
            PERSON.stats.map((s) => h("div", { className: "pf-stat", key: s.label },
              h("b", null, String(s.value)), h("span", null, s.label))))
        );
      }

      const demo = document.getElementById("demo");
      if (demo) ReactDOM.createRoot(demo).render(React.createElement(FixedCard));

      const PARTS = [
        { name: "App",    file: "App.jsx",               sel: ".pf-card",   job: "The whole card. Decides what goes where." },
        { name: "Avatar", file: "components/Avatar.jsx", sel: ".pf-avatar", job: "Initials in a circle. Knows nothing about profiles." },
        { name: "Stat",   file: "components/Stat.jsx",   sel: ".pf-stat",   job: "One number with a label. Used three times - which is why it exists." },
      ];

      const tree = document.getElementById("tree");
      if (tree) {
        tree.innerHTML = PARTS.map((p) =>
          '<li class="bs-part" data-sel="' + p.sel + '" tabindex="0">' +
            '<code>&lt;' + p.name + ' /&gt;</code>' +
            '<span class="bs-file">' + p.file + '</span>' +
            '<span class="bs-job">' + p.job + '</span>' +
          '</li>').join("");

        tree.querySelectorAll(".bs-part").forEach((row) => {
          const on = () => {
            demo.querySelectorAll(row.dataset.sel).forEach((el) => el.classList.add("pf-lit"));
            row.classList.add("bs-part-on");
          };
          const off = () => {
            demo.querySelectorAll(".pf-lit").forEach((el) => el.classList.remove("pf-lit"));
            row.classList.remove("bs-part-on");
          };
          row.addEventListener("pointerenter", on);
          row.addEventListener("pointerleave", off);
          row.addEventListener("focus", on);
          row.addEventListener("blur", off);
        });
      }

      /* ---- Act 3: the answer, and the same answer as a picture ------------------

         Left: the reply, exactly as the API sends it. Right: that reply, drawn.
         Hover a row in the reply and its bar lights up. They are the same numbers.  */

      const reply = document.getElementById("reply");
      if (reply) {
        reply.textContent = JSON.stringify(API, null, 2);
      }

      const graph = document.getElementById("graph");
      if (graph) {
        const most = Math.max(...API.rows.map((r) => r[1]));
        graph.innerHTML = API.rows.map((row, i) =>
          '<div class="g-row" data-i="' + i + '">' +
            '<span class="g-name">' + row[0] + '</span>' +
            '<span class="g-track"><span class="g-bar" style="width:' + (row[1] / most) * 100 + '%"></span></span>' +
            '<b class="g-value">' + row[1] + '</b>' +
          '</div>').join("");

        // the rows of the reply, as hoverable chips, tied to the bars
        const rowList = document.getElementById("rowlist");
        if (rowList) {
          rowList.innerHTML = API.rows.map((row, i) =>
            '<li class="g-chip" data-i="' + i + '" tabindex="0"><code>["' + row[0] + '", ' + row[1] + ']</code></li>'
          ).join("");

          const link = (i, on) => {
            const bar = graph.querySelector('.g-row[data-i="' + i + '"]');
            const chip = rowList.querySelector('.g-chip[data-i="' + i + '"]');
            if (bar) bar.classList.toggle("g-lit", on);
            if (chip) chip.classList.toggle("g-lit", on);
          };
          rowList.querySelectorAll(".g-chip").forEach((c) => {
            c.addEventListener("pointerenter", () => link(c.dataset.i, true));
            c.addEventListener("pointerleave", () => link(c.dataset.i, false));
            c.addEventListener("focus", () => link(c.dataset.i, true));
            c.addEventListener("blur", () => link(c.dataset.i, false));
          });
          graph.querySelectorAll(".g-row").forEach((r) => {
            r.addEventListener("pointerenter", () => link(r.dataset.i, true));
            r.addEventListener("pointerleave", () => link(r.dataset.i, false));
          });
        }
      }

      /* ---- the install checklist ------------------------------------------------ */

      const STEPS = [
        { cmd: "node -v",
          why: "Vite needs Node 18 or newer. This is the one thing that fails quietly and costs an hour.",
          done: "a number starting with v18, v20, v22 or v24. 'Command not found' means Node is not installed yet." },
        { cmd: "npm create vite@latest my-app -- --template react",
          why: "Makes the folder and the files. The bare -- passes the rest through to the template.",
          done: "a my-app folder exists, with package.json and src/App.jsx inside it." },
        { cmd: "cd my-app && npm install",
          why: "Downloads everything package.json asked for into node_modules.",
          done: "node_modules exists. It is huge. That is normal." },
        { cmd: "npm run dev",
          why: "Starts Vite. It translates your JSX every time you save.",
          done: "a http://localhost:5173 line appears and the terminal keeps running. It is meant to." },
        { cmd: "open http://localhost:5173",
          why: "Your app. Vite translated the JSX on the way to the browser.",
          done: "the starter page renders." },
        { cmd: "change a word in src/App.jsx and save",
          why: "You did not reload anything.",
          done: "the browser updated by itself." },
      ];

      const KEY = "ics-build-step-steps";
      const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
      const write = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} };

      const ticked = read();
      const list = document.getElementById("steps");
      if (list) {
        STEPS.forEach((s, i) => {
          const id = "bs" + i;
          const li = document.createElement("li");
          li.className = "bs-step";
          li.innerHTML =
            '<label><input type="checkbox" data-id="' + id + '"' + (ticked[id] ? " checked" : "") + '>' +
            '<span><code class="bs-cmd">' + s.cmd + '</code>' +
            '<span class="bs-why">' + s.why + '</span>' +
            '<span class="bs-done"><b>Done when:</b> ' + s.done + '</span></span></label>';
          list.appendChild(li);
        });
        list.addEventListener("change", (e) => {
          if (e.target.type !== "checkbox") return;
          ticked[e.target.dataset.id] = e.target.checked;
          write(ticked);
        });
      }

      /* ============================================================
         BREAK IT ON PURPOSE

         In the editor at the top. One at a time. Every one of these was run first.

         START ON HELLO WORLD - it is two lines, so the error has nowhere to hide.

         delete the </h1>           "Unterminated JSX contents." You said where to
                                    start and never where to stop, and Babel ran out
                                    of file still waiting.

         <h1>Hello</p>              "Expected corresponding JSX closing tag for <h1>."
                                    A different sentence for a near-identical mistake:
                                    this time it found a closer, just the wrong one.

         rename App to Page         "No component called App - did you rename it?"
                                    The picture looks for App. Real projects hit this
                                    too, they just call it an import error.

         NOW SWITCH TO PROFILE and try these.

         className -> class         It still draws, and it keeps its styling. React is
                                    forgiving here - but open your browser console and
                                    it is telling you: "Invalid DOM property `class`.
                                    Did you mean `className`?" Nothing on the page
                                    says so. THE CONSOLE IS PART OF THE PAGE.

         remove the ( ) after       NO ERROR, and nothing draws. It becomes "return;"
         return in App              with the card below it as dead code. A blank box
                                    and a clean console is a worse afternoon than any
                                    error message. The brackets are not decoration.

         {person.name} ->           the words "person.name" appear on the card as
         person.name                plain text. Curly brackets are how you stop
                                    writing text and start writing JavaScript.

         <avatar /> instead         an empty unknown tag appears and your component
         of <Avatar />              never runs. Capital letter means my component,
                                    lowercase means an HTML tag. That is the rule.

         delete key={s.label}       draws fine, and the console says "Each child in a
                                    list should have a unique key prop." Keys are how
                                    React tells three Stats apart when one changes.

         NOW SWITCH TO DATA.

         api.rows -> api.row        "Cannot read properties of undefined (reading
                                    'map')." The reply has no `row` in it. Look at the
                                    reply on the left and spell it the way it is
                                    written there - that is most API debugging.

         remove / most from         every bar fills the whole width. The widths were a
         the width                  share of the biggest one; without it you are
                                    drawing 57% and 44% as the same thing.

         tick the modern runtime    React.createElement becomes _jsx, and an import
                                    appears that you never typed. That import is what
                                    people mean by "the build step adds things" - and
                                    it is why the picture falls back to the classic
                                    output, because a browser cannot run an import by
                                    itself.
         ============================================================ */
    </script>
  </div>

  <script src="../../js/preview-core.js"></script>
  <script src="../../js/playground.js"></script>
