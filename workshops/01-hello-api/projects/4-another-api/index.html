<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework — Another API</title>
  <link rel="stylesheet" href="../../../../css/theme.css">
</head>
<body>

  <main class="ics-wrap">
    <span class="ics-step">Homework</span>

    <p class="ics-sub" style="color:var(--grey-dark)">
      Somebody else's data, same three lines. Posts come from
      <code>jsonplaceholder.typicode.com/posts?_limit=12</code>
    </p>

    <div class="ics-row">
      <button class="ics-btn" id="loadBtn">Load the posts</button>
      <span class="ics-count" id="count"></span>
    </div>

    <div class="ics-grid" id="cards"></div>
  </main>

  <script src="js/main.js"></script>

</body>
</html>
