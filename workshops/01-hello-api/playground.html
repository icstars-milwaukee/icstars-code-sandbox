    <script type="text/plain" data-pg-file="1-one-pokemon/js/main.js">
      /* STEP 1 · I DO — one Pokémon on the page.

         Three lines do the work. They are the same three lines in every
         project in this workshop:  ASK, UNWRAP, SHOW. */

      const API_URL = "https://pokeapi.co/api/v2/pokemon/25";

      const button = document.getElementById("loadBtn");
      const output = document.getElementById("output");
      const sprite = document.getElementById("sprite");

      // async = "there is a wait inside this function."
      button.addEventListener("click", async function () {
        output.textContent = "Loading...";

        // await = "pause right here until the data comes back."
        const response = await fetch(API_URL);     // 1. ASK    — go get it
        const pokemon  = await response.json();    // 2. UNWRAP — open the envelope

        // 3. SHOW — put the data on the page.
        output.textContent =
          "name:   " + pokemon.name + "\n" +
          "id:     " + pokemon.id + "\n" +
          "weight: " + pokemon.weight + "\n" +
          "type:   " + pokemon.types[0].type.name;

        // The picture is not special. It is a field holding a URL, handed
        // to an <img>. Count the dots: sprites, then front_default.
        // That is NESTING, and this line becomes the silhouette in step 2.
        sprite.src = pokemon.sprites.front_default;
        sprite.alt = pokemon.name;
      });


      /* BREAK IT ON PURPOSE — each of these teaches one thing:

         change 25 to 99999         there is no Pokémon 99999. A 404 is the
                                    API telling you so, clearly. Meet one here.
         delete the first `await`    you get "[object Promise]" — the wait
                                    never happened, so you printed the waiting.
         change front_default to foo a broken image. foo is undefined, and
                                    undefined is not an address.
         delete `async`              "await is only valid in async functions."
                                    The two words come as a pair.                */
    </script>

    <script type="text/plain" data-pg-file="2-the-mystery/js/main.js">
      /* STEP 2 · WE DO — a random mystery.

         Same two fetch lines as step 1. One new idea: this URL returns a
         LIST, and a list is something you can pick from at random. */

      const API_URL = "https://pokeapi.co/api/v2/pokemon?limit=151";
      const SPRITES = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";

      const sprite    = document.getElementById("sprite");
      const revealBtn = document.getElementById("revealBtn");
      const nextBtn   = document.getElementById("nextBtn");
      const answerEl  = document.getElementById("answer");
      const statusEl  = document.getElementById("status");

      let allPokemon = [];     // all 151, straight from the API
      let mystery    = null;   // the one being hidden right now

      async function load() {
        const response = await fetch(API_URL);
        const data     = await response.json();

        // This API wraps its list in a field called "results". Square
        // brackets [ ] mean a list — so you can loop it, count it, and
        // pick from it. That sentence is why a game is possible at all.
        allPokemon = data.results;

        statusEl.textContent = "Loaded " + allPokemon.length + " Pokémon.";
        newMystery();
      }

      function newMystery() {
        // Math.random() gives 0 to 0.999…; times the length, floored, is
        // a valid slot every time. You will use this for the rest of your life.
        mystery = allPokemon[Math.floor(Math.random() * allPokemon.length)];

        // Each item is { name: "pikachu", url: ".../pokemon/25/" }. Only the
        // number out of that url is needed to build the picture address.
        const id = mystery.url.split("/")[6];
        sprite.src = SPRITES + id + ".png";
        sprite.alt = "Mystery Pokémon silhouette";

        // .hidden is one line of CSS: filter: brightness(0). It paints
        // every pixel black. That is the entire silhouette effect.
        sprite.classList.add("hidden");

        answerEl.textContent = "";
        revealBtn.disabled = false;
        nextBtn.disabled = true;
      }

      revealBtn.addEventListener("click", function () {
        sprite.classList.remove("hidden");        // that is the whole trick
        sprite.alt = mystery.name;
        answerEl.textContent = "It's " + mystery.name + "!";
        revealBtn.disabled = true;
        nextBtn.disabled = false;
      });

      nextBtn.addEventListener("click", newMystery);

      load();


      /* BREAK IT ON PURPOSE:

         limit=151 -> limit=3       the mystery repeats constantly. Random
                                    needs something to be random across.
         delete .results            "allPokemon.length is undefined" — you
                                    kept the envelope instead of the letter.
         split("/")[6] -> [5]       a broken image. The number was in slot 6.
         remove the classList.add   no silhouette — it just shows you the answer. */
    </script>

      function shuffle(list)    { list.sort(function () { return Math.random() - 0.5; }); }
      function idFromUrl(url)   { return url.split("/")[6]; }

        if (choicesEl.children.length === 0) {

    <script type="text/plain" data-pg-file="3-the-game-solution/js/main.js">
      /* STEP 3 · ANSWER KEY — the three TODOs, filled in

         A game is just:  data  +  a random pick  +  a click handler.
         Steps 1 and 2 built the first two. This adds the click. */

      const API_URL = "https://pokeapi.co/api/v2/pokemon?limit=151";
      const SPRITES = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";

      const sprite    = document.getElementById("sprite");
      const choicesEl = document.getElementById("choices");
      const statusEl  = document.getElementById("status");
      const scoreEl   = document.getElementById("score");
      const nextBtn   = document.getElementById("nextBtn");

      let allPokemon = [];
      let answer     = null;
      let right      = 0;   // how many you got right
      let asked      = 0;   // how many you have been asked

      function pickRandom(list) { return list[Math.floor(Math.random() * list.length)]; }
      function shuffle(list)    { list.sort(function () { return Math.random() - 0.5; }); }
      function idFromUrl(url)   { return url.split("/")[6]; }


      async function load() {
        // TODO 1, done.
        const response = await fetch(API_URL);
        const data     = await response.json();
        allPokemon     = data.results;

        newRound();
      }

      function newRound() {
        nextBtn.disabled = true;
        sprite.classList.add("hidden");
        statusEl.className   = "ics-note";
        statusEl.textContent = "Who's that Pokémon?";

        answer = pickRandom(allPokemon);
        const choices = [answer];
        while (choices.length < 4) {
          const maybe = pickRandom(allPokemon);
          if (!choices.includes(maybe)) { choices.push(maybe); }
        }
        shuffle(choices);

        sprite.src = SPRITES + idFromUrl(answer.url) + ".png";

        // TODO 2, done.
        choicesEl.innerHTML = "";
        choices.forEach(function (option) {
          const btn = document.createElement("button");
          btn.className   = "ics-choice";
          btn.textContent = option.name;
          btn.addEventListener("click", function () { guess(btn, option); });
          choicesEl.appendChild(btn);
        });
      }

      function guess(button, picked) {
        sprite.classList.remove("hidden");
        asked++;

        // TODO 3, done.
        if (picked === answer) {
          right++;
          button.classList.add("right");
          statusEl.className   = "ics-note success";
          statusEl.textContent = "Correct!";
        } else {
          button.classList.add("wrong");
          statusEl.className   = "ics-note error";
          statusEl.textContent = "Not quite — it was " + answer.name + ".";
        }

        document.querySelectorAll(".ics-choice").forEach(function (b) {
          b.disabled = true;
          if (b.textContent === answer.name) { b.classList.add("right"); }
        });

        scoreEl.innerHTML = "SCORE <b>" + right + "</b> / " + asked;
        nextBtn.disabled = false;
      }

      nextBtn.addEventListener("click", newRound);

      load();

         choices.length < 4 -> < 2  a coin flip. Four choices is a design
                                    decision, not a rule of the universe.
         picked === answer -> ==    still works here. Ask why `===` is the
