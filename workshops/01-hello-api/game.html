<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who's That Pokémon? · i.c.stars</title>

  <!-- Two stylesheets: the shared theme, then this site's few extras. -->
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>

  <header class="ics-header">
    <div class="ics-wrap">
      <a class="ics-back" href="index.html">&larr; Hello, API</a>
      <div class="ics-brand">i.c.stars<span class="pipe">|</span><span class="star">*</span></div>
      <h1 class="ics-title">Who's That Pokémon?</h1>
      <p class="ics-sub">The finished game. Loads by itself, keeps score, survives a dead wifi.</p>
    </div>
  </header>

  <div class="ics-stage">
    <img id="sprite" class="ics-sprite hidden" alt="Mystery Pokémon silhouette">
  </div>

  <main class="ics-wrap">

    <div class="ics-row scoreboard">
      <span class="ics-score" id="score">SCORE <b>0</b> / 0</span>
      <span class="streak" id="streak"></span>
      <span class="ics-count" id="best"></span>
    </div>

    <!-- JavaScript owns everything below this line. -->
    <div class="ics-choices" id="choices"></div>
    <div class="ics-note" id="status">Loading 151 Pokémon...</div>

    <div class="ics-row">
      <button class="ics-btn" id="nextBtn" disabled>Next &rarr;</button>
      <button class="ics-btn ghost" id="resetBtn">Reset score</button>
    </div>

    <p class="ics-footer">
      Sample data from <a href="https://pokeapi.co/">PokeAPI</a> · sprites from the PokeAPI archive.
      Built in 30 minutes at i.c.stars. Next: the same thing in React.
    </p>
  </main>

  <!-- Script last, so the HTML above already exists when it runs. -->
  <script src="js/game.js"></script>
</body>
</html>
