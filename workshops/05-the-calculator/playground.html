      <!DOCTYPE html>
      <html lang="en">
      <head>

      <body>

        <header class="ics-header">
          <div class="ics-wrap">
            <a class="ics-back" href="../../index.html">&larr; Code Sandbox</a>
            <div class="ics-brand">i.c.stars<span class="pipe">|</span><span class="star">*</span> Milwaukee</div>
            <h1 class="ics-title">The Calculator</h1>
            <p class="ics-sub">
              Three functions, eleven lines, one calculator. Numbers go in, an answer
              comes out &mdash; until you ask it to divide by zero, and then it has to
              decide what an honest function does when <strong>it cannot do its
              job.</strong>
            </p>
          </div>
        </header>

        <main class="ics-wrap">

          <!-- 1 -->
          <span class="ics-step">1 &middot; The calculator</span>

          <p class="ics-sub" style="color:var(--grey-dark);margin-top:12px">
            It works. Change the numbers, press a button. Then make the second number
            <strong>0</strong> and press &divide;.
          </p>

          <!-- React builds the calculator in here. -->
          <div id="calc"></div>

          <!-- 2 -->
          <span class="ics-step">2 &middot; What a function actually is</span>

          <p>
            A machine with four parts. That is the whole idea, and every function you
            will ever write &mdash; in any language &mdash; has these same four:
          </p>

          <div class="cx-anatomy">function add(a, b) { return a + b; }
               │   │     │ │
               │   │     │ └─ <span class="pt">return</span>
               │   │     └─── <span class="pt">body</span>
               │   └───────── <span class="pt">inputs</span>
               └───────────── <span class="pt">name</span></div>

          <ol class="cx-parts">
            <li><b>name</b> &mdash; so something else can call it</li>
            <li><b>inputs</b> &mdash; what it needs in order to work.
                Also called <em>parameters</em>, or <em>arguments</em> when you are
                talking about the actual values you hand over.</li>
            <li><b>body</b> &mdash; the work. Everything between the <code>{ }</code>.</li>
            <li><b>return</b> &mdash; the answer it hands back</li>
          </ol>

          <p>
            <strong>Call</strong> it and the answer comes back:
            <code>add(2, 3)</code> is <code>5</code>. The two numbers you hand it are
            the <strong>inputs</strong>. The 5 is the <strong>return value</strong>.
            You write the machine once and press the button a thousand times.
          </p>

          <p class="ics-note">
            Leave off the <code>return</code> and the function still runs perfectly.
            It just hands back nothing &mdash; and whatever called it gets
            <code>undefined</code>. That is the most common bug in this whole
            workshop, and the BREAK IT list at the bottom of
            <code>js/main.js</code> makes you cause it on purpose.
          </p>

          <!-- 3 -->
          <span class="ics-step">3 &middot; Three functions, one shape</span>

          <p>
            Here is all of <code>js/lib/math.js</code>. Same four parts every time
            &mdash; only the body changes:
          </p>

          <div class="ics-tablewrap">
            <table class="ics-table">
              <tr><th>Name</th><th>Body</th><th>Works for any two numbers?</th></tr>
              <tr>
                <td><code>add</code></td>
                <td><code>return a + b;</code></td>
                <td>Yes.</td>
              </tr>
              <tr>
                <td><code>subtract</code></td>
                <td><code>return a - b;</code></td>
                <td>Yes &mdash; but the <strong>order</strong> matters.
                    <code>subtract(3, 10)</code> is <code>-7</code>, not <code>7</code>.</td>
              </tr>
              <tr class="cx-rownull">
                <td><code>divide</code></td>
                <td><code>if (b === 0) return null;</code><br><code>return a / b;</code></td>
                <td><strong>No.</strong> Which is why it has an extra line.</td>
              </tr>
            </table>
          </div>

          <!-- 4 -->
          <span class="ics-step">4 &middot; The function that cannot always answer</span>

          <p>
            Dividing by zero has no answer. Not a big answer, not zero &mdash; no
            answer at all. So <code>divide</code> has to decide what to do when it
            cannot do its job, and it has three choices:
          </p>

          <div class="ics-tablewrap">
            <table class="ics-table">
              <tr><th>It could&hellip;</th><th>Screen shows</th><th>Why that is a problem</th></tr>
              <tr>
                <td><code>return 0</code></td>
                <td><code>0</code></td>
                <td><strong>A lie that looks true.</strong> 10 &divide; 0 is not 0. Now a
                    wrong number is loose in the program with nothing marking it as
                    wrong, and anyone who reads it will believe it.</td>
              </tr>
              <tr>
                <td>nothing &mdash; let JavaScript answer</td>
                <td><code>Infinity</code></td>
                <td>Honest, and useless on a screen. It is also sticky: add anything to
                    Infinity and you still get Infinity, so one bad divide spreads into
                    every sum after it.</td>
              </tr>
              <tr>
                <td><code>return null</code> &mdash; what it does</td>
                <td><strong>no answer</strong></td>
                <td>Nothing. <code>null</code> means &ldquo;no answer&rdquo;, and whoever
                    called the function now has to deal with that out loud.</td>
              </tr>
            </table>
          </div>

          <p class="ics-note">
            <strong>A function that admits it has no answer is worth more than one
            that invents a believable number.</strong> Same rule as workshop 03's
            panel that refuses questions it cannot trace, and the same rule as week
            8's <code>not built yet</code> &mdash; say where you stop.
          </p>

          <p>
            So who deals with it? <code>js/components/Readout.js</code>, in three
            lines: it checks <code>answer === null</code> and prints <em>no answer
            &mdash; you cannot divide by zero</em>. The function decided it could not
            answer; the screen decided how to say so. Two jobs, two files.
          </p>

          <!-- 5 -->
          <span class="ics-step">5 &middot; Where the files live, and why</span>

          <ul class="cx-files">
            <li><code>js/lib/math.js</code>
              <span>The three functions. No React, no buttons, no HTML &mdash; it draws
                nothing at all. <strong>Work goes in lib/.</strong></span></li>
            <li><code>js/components/Readout.js</code>
              <span>Shows the answer, or says there is not one. Does no arithmetic.</span></li>
            <li><code>js/components/Calculator.js</code>
              <span>The screen: two inputs, three buttons. <strong>Screens go in
                components/.</strong> It does not know how to add &mdash; it only knows
                which function to call.</span></li>
            <li><code>js/main.js</code>
              <span>Puts the calculator on the page, runs the table below, and ends with
                the BREAK IT list.</span></li>
          </ul>

          <p>
            Same split as <a href="../04-the-build-step/index.html">04 &mdash; The
            Build Step</a>. The reason it earns its keep is the next section.
          </p>

          <!-- 6 -->
          <span class="ics-step">6 &middot; Why that split is worth it</span>

          <p>
            This table ran the same three functions the calculator runs &mdash; with no
            screen, no buttons and nobody clicking. It is only possible because the
            arithmetic lives in <code>lib/</code> and <strong>returns</strong> its
            answer instead of drawing it:
          </p>

          <div class="ics-tablewrap">
            <table class="ics-table cx-proof">
              <tr><th>The call</th><th>Came back</th><th></th></tr>
              <tbody id="proof"></tbody>
            </table>
          </div>

          <p>
            That is a test. Seven of them. If someone breaks <code>add</code>, this
            table says so before a human notices &mdash; which is exactly what
            <strong>week 8</strong> asks you to do to your own project, one row per
            MUST on your Jira board.
          </p>

          <p class="ics-footer">
            React straight from a CDN &mdash; no npm, no build step. The lesson is
            <code>js/lib/math.js</code>, and <code>js/main.js</code> ends with a
            <strong>BREAK IT ON PURPOSE</strong> list.
            <br>Next: <a href="../04-the-build-step/index.html">04 &mdash; The Build
            Step</a> writes screens in JSX and explains what installing buys you.
            <br>Open it in the <a href="playground.html">live editor</a>.
          </p>
        </main>

        <!-- React as plain scripts, not modules: a browser on a file:// path refuses
             to load a local module, so a workshop that must run off disk cannot use
             import. Order matters - each file below needs the ones above it. -->
        <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin><\/script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin><\/script>
        <script src="js/lib/math.js"><\/script>
        <script src="js/components/Readout.js"><\/script>
        <script src="js/components/Calculator.js"><\/script>
        <script src="js/main.js"><\/script>

      </body>

    <script type="text/plain" data-pg-file="css/calc.css">
      /* Local to this workshop. Everything else comes from ../../css/theme.css,
         which is shared and never forked. */

      .cx { max-width: 24rem; }

      /* the two numbers, with the operator between them */
      .cx-inputs { display: grid; grid-template-columns: 1fr 2.2rem 1fr; gap: 10px; align-items: center; }
      .cx-num { text-align: center; font-family: var(--mono); font-size: 1.1rem; }
      .cx-opshow { text-align: center; font-size: 1.3rem; font-weight: 700; color: var(--red); }

      /* one button per function */
      .cx-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
      .cx-key {
        font: inherit; cursor: pointer; padding: .7em .4em; border-radius: 8px;
        background: none; border: 1px solid #D8CFC8; color: var(--ink);
        display: flex; flex-direction: column; align-items: center; gap: .15em;
      }
      .cx-key b { font-size: 1.25rem; line-height: 1; }
      .cx-key span { font-size: 11.5px; color: var(--grey-dark); font-family: var(--mono); }
      .cx-key:hover { border-color: var(--grey-dark); }
      .cx-key.cx-on { background: var(--red); border-color: var(--red); color: #fff; }
      .cx-key.cx-on span { color: rgba(255,255,255,.85); }
      .cx-key:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

      /* the answer */
      .cx-readout {
        margin-top: 14px; padding: 16px; border-radius: 8px;
        background: var(--ink); color: var(--paper);
        display: flex; flex-direction: column; gap: .2em;
      }
      .cx-readout b { font-size: 1.9rem; line-height: 1.1; font-family: var(--mono); }
      .cx-readout span { font-size: 12.5px; color: var(--grey); font-family: var(--mono); }
      .cx-readout.cx-empty b { color: var(--grey); }
      .cx-readout.cx-noanswer { background: var(--ink-soft); border-left: 4px solid var(--red); }
      .cx-readout.cx-noanswer b { font-size: 1.2rem; color: #FF9CB4; }

      }

      /* the four parts of a function, labelled */

    </script>
    <script type="text/plain" data-pg-file="js/components/Calculator.js">
      /* js/components/Calculator.js
         ONE JOB: the screen - two numbers, three buttons, one answer.

         Watch what it does with the functions. It does not know HOW to add. It only
         knows WHICH function to call:

             const answer = ICS[chosen.key](numA, numB);

         Change the body of ICS.add in js/lib/math.js and this file never notices.
         That is what you get for keeping the work out of the screen. */

      window.ICS = window.ICS || {};

      ICS.Calculator = function Calculator() {
        const h = React.createElement;
        const useState = React.useState;

        const [a, setA] = useState("10");
        const [b, setB] = useState("2");
        const [op, setOp] = useState(null);     // null until a button is pressed

        // One entry per function in js/lib/math.js. `key` is the function's name.
        const OPS = [
          { key: "add",      symbol: "+", label: "add" },
          { key: "subtract", symbol: "−", label: "subtract" },
          { key: "divide",   symbol: "÷", label: "divide" },
        ];

        /* An input box gives you TEXT. Always - even type="number". "10" is not 10,
           and "10" + "2" is "102", because + glues text together. Number() is the
           fix, and forgetting it is where most calculator bugs start. */
        const numA = Number(a);
        const numB = Number(b);

        const chosen = OPS.find(function (o) { return o.key === op; });
        const answer = chosen ? ICS[chosen.key](numA, numB) : undefined;
        const shown  = chosen ? numA + " " + chosen.symbol + " " + numB : "";

        return h("div", { className: "cx" },

          h("div", { className: "cx-inputs" },
            h("input", {
              className: "ics-input cx-num", type: "number", value: a,
              "aria-label": "first number",
              onChange: function (e) { setA(e.target.value); },
            }),
            h("span", { className: "cx-opshow" }, chosen ? chosen.symbol : "?"),
            h("input", {
              className: "ics-input cx-num", type: "number", value: b,
              "aria-label": "second number",
              onChange: function (e) { setB(e.target.value); },
            })),

          // Three buttons, three functions. The button does not do the maths.
          h("div", { className: "cx-keys" },
            OPS.map(function (o) {
              return h("button", {
                key: o.key,
                className: "cx-key" + (op === o.key ? " cx-on" : ""),
                onClick: function () { setOp(o.key); },
              }, h("b", null, o.symbol), h("span", null, o.label));
            })),

          h(ICS.Readout, { answer: answer, shown: shown }),

          /* The call, written out. This is the line that makes a function click:
             a name, two inputs going in, one answer coming back. */
          chosen ? h("p", { className: "cx-call" },
            h("code", null, chosen.key + "(" + numA + ", " + numB + ")"),
            " → ",
            h("code", null, answer === null ? "null" : String(answer))) : null
        );
      };
    </script>
    <script type="text/plain" data-pg-file="js/components/Readout.js">
      /* js/components/Readout.js
         ONE JOB: show the answer, or say there isn't one.

         This is where divide's null gets handled. The component asks one question -
         "did I actually get a number?" - and says so plainly when it did not.

         It does no arithmetic. It cannot. All it does is show what lib/ handed it.
         That split is the point.

         About h(): workshop 04 wrote screens in JSX, which needed installing. This
         page has to run off a double-click, so there is no build step to turn JSX
         into anything. h() IS what JSX turns into - tag, props, children:

             JSX   <b className="big">42</b>
             h()   h("b", { className: "big" }, "42")

         Same call. One of them just has a compiler in front of it. */

      window.ICS = window.ICS || {};

      ICS.Readout = function Readout(props) {
        const h = React.createElement;
        const answer = props.answer;

        // divide, admitting it has no answer
        if (answer === null) {
          return h("div", { className: "cx-readout cx-noanswer" },
            h("b", null, "no answer"),
            h("span", null, "you cannot divide by zero"));
        }

        // nothing asked yet
        if (answer === undefined) {
          return h("div", { className: "cx-readout cx-empty" },
            h("b", null, "—"),
            h("span", null, "pick two numbers, then an operation"));
        }

        return h("div", { className: "cx-readout" },
          h("b", null, String(answer)),
          h("span", null, props.shown || ""));
      };
    </script>
    <script type="text/plain" data-pg-file="js/lib/math.js">
      /* js/lib/math.js
         ONE JOB: do the arithmetic. Nothing in this file draws anything.

         This is the whole lesson, and it is eleven lines of real code.

         A FUNCTION IS A MACHINE WITH FOUR PARTS

             function add(a, b) { return a + b; }
                      ^^^  ^^^^           ^^^^^
                      name inputs         output

           1. a NAME, so something else can call it
           2. INPUTS (parameters) - what it needs in order to work
           3. a BODY - the work
           4. a RETURN - the answer it hands back

         Leave off the return and the function still runs. It just hands back
         nothing, and whatever called it gets `undefined`. That is the most common
         bug this file will ever have.

         WHY THESE LIVE IN lib/ AND NOT components/
         They draw nothing. You can run them with no browser, no button and no
         React - which is exactly what the table at the bottom of the page does.
         Screens go in components/, work goes in lib/. Same rule as workshop 04. */

      window.ICS = window.ICS || {};

      /* Same inputs, same answer, every time. Nothing remembered between calls,
         nothing outside the function touched. A function like that is called PURE,
         and it is the easiest kind of code there is to trust. */

      ICS.add = function add(a, b) {
        return a + b;
      };

      ICS.subtract = function subtract(a, b) {
        return a - b;
      };

      /* And then there is divide.

         Two of these three work for ANY two numbers you hand them. Divide does not.
         Dividing by zero has no answer - not a big answer, not zero, no answer.

         So this function has to decide what to do when it cannot do its job. It
         returns null, which means "no answer", and whoever called it has to deal
         with that. js/components/Readout.js is where it gets dealt with.

         The two tempting alternatives are both worse:

           return 0          A lie. 10 / 0 is not 0, and now a wrong number is loose
                             in the program with nothing marking it as wrong.
           return Infinity   What JavaScript does on its own. True to the maths,
                             useless on a screen, and it spreads into every sum
                             that touches it afterwards.

         A function that admits it has no answer is worth more than one that invents
         a believable number. */

      ICS.divide = function divide(a, b) {
        if (b === 0) return null;      // the guard: check first, work second
        return a / b;
      };
    </script>
    <script type="text/plain" data-pg-file="js/main.js">
      /* js/main.js
         ONE JOB: put the calculator on the page, and run the proof table.

         Everything below was loaded by the <script> tags in index.html, in this
         order - because each one needs the one above it:

             js/lib/math.js               add, subtract, divide
             js/components/Readout.js     the answer, or no answer
             js/components/Calculator.js  the screen
             js/main.js                   this file

         Plain <script> tags rather than import, because this page has to work when
         you double-click it, and a browser opening a file off your disk refuses to
         load a local module. Workshop 04 is the one that explains that properly. */

      (function () {

        /* ---- 1 · the screen ---- */

        const root = document.getElementById("calc");
        if (root) {
          ReactDOM.createRoot(root).render(React.createElement(ICS.Calculator));
        }

        /* ---- 2 · the proof table ----

           Here is the thing worth noticing. This runs the SAME three functions the
           calculator runs - with no screen, no buttons and nobody clicking.

           That is only possible because the arithmetic lives in lib/ and RETURNS
           its answer instead of drawing it. Work you can check without a human is
           work you can trust, and it is why that split exists. */

        const CASES = [
          ["add",      2,  3],
          ["add",     -4,  4],
          ["subtract", 10, 3],
          ["subtract", 3, 10],    // order of inputs matters here, unlike add
          ["divide",   10, 2],
          ["divide",    7, 2],
          ["divide",   10, 0],    // the one with no answer
        ];

        const table = document.getElementById("proof");
        if (table) {
          table.innerHTML = CASES.map(function (c) {
            const name = c[0], x = c[1], y = c[2];
            const got = ICS[name](x, y);
            const shown = got === null ? "null" : String(got);
            const note = got === null ? "divide said it has no answer" : "";
            return "<tr" + (got === null ? ' class="cx-rownull"' : "") + ">"
                 + "<td><code>" + name + "(" + x + ", " + y + ")</code></td>"
                 + "<td><code>" + shown + "</code></td>"
                 + "<td>" + note + "</td></tr>";
          }).join("");
        }

      })();

      /* ============================================================
         BREAK IT ON PURPOSE

         Open js/lib/math.js in the live editor. One change at a time, then put it
         back. Every one of these was run before it went on this list.

         delete  return  from add         Every sum shows "undefined". The function
                                          still RAN - it just handed nothing back.
                                          A function with no return is a machine
                                          with no output chute.

         change add's body to  a - b      Every addition is now wrong and NOTHING
                                          complains. No error, no warning, no red
                                          text. Wrong answers are the quietest bug
                                          there is, which is the entire reason the
                                          proof table exists.

         in subtract, swap it to  b - a   subtract(10, 3) starts giving -7. The
                                          ORDER of the inputs is part of what a
                                          function promises. add survives this one;
                                          subtract does not.

         delete divide's guard - the      Try 10 ÷ 0: the screen says "Infinity".
         whole  if (b === 0)  line        That is JavaScript's honest answer and a
                                          useless one for a person reading it.

         make divide  return 0  instead   Worse, and this is the one to sit with.
         of  null                         10 ÷ 0 now shows "0", which looks like a
                                          real answer. Nothing marks it as wrong.
                                          Show it to someone and they will believe
                                          it. That is why null is there.

         in Calculator.js, delete both    Type 10 and 2, press +, get "102". An
         Number() calls                   input gives you text, always, and + glues
                                          text together instead of adding it.
         ============================================================ */
    </script>
  </div>
